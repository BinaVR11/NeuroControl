<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BINAES — Experiencia Interactiva</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <!-- PANTALLA DE INICIO -->
    <main class="view active" id="homeView" aria-label="Inicio">
      <!-- IMAGEN PRINCIPAL: cambiar CONFIG.homeImage en script.js --><img id="homeImage" class="home-bg" alt="Imagen principal de inicio">
      <div class="home-overlay"></div>
      <div class="home-content">
        <img class="brand-logo" src="assets/escudo.png" alt="BINAES">
        <p class="welcome">BIENVENIDO</p>
        <p class="welcome-small">A</p>
        <h1>BINAES</h1>
        <button class="primary-btn" id="startBtn">PRESIONA PARA CONTINUAR <span>→</span></button>
      </div>
    </main>

    <!-- SELECCIÓN DE NIVEL -->
    <main class="view" id="levelsView" aria-label="Selección de nivel">
      <header class="section-header reveal">
        <div>
          <p class="eyebrow">EXPERIENCIA BINAES</p>
          <h2>SELECCIONA UN NIVEL</h2>
          <div class="header-line"></div>
        </div>
        <img src="assets/logoazul.png" alt="BINAES" class="small-logo">
      </header>

      <section class="levels-grid" id="levelsGrid"></section>
      <div class="selector-photo reveal" id="levelsImageSlot">
        <!-- IMAGEN OPCIONAL: cambiar CONFIG.levelsImage en script.js -->
        <img id="levelsImage" class="levels-photo-img" alt="Imagen de apoyo">
        <div class="image-slot-label levels-image-label">
          <strong>ESPACIO PARA IMAGEN</strong>
          <span>CAMBIAR EN script.js → CONFIG.levelsImage</span>
        </div>
      </div>
    </main>

    <!-- DETALLE DEL NIVEL -->
    <main class="view" id="detailView" aria-label="Detalle del nivel">
      <button class="icon-btn back-btn" id="backBtn" aria-label="Regresar a selección de nivel" title="Regresar">←</button>

      <header class="detail-header reveal">
        <div>
          <p class="eyebrow" id="detailEyebrow">NIVEL 1</p>
          <h2 id="detailTitle">NIVEL 1</h2>
          <p id="detailDescription"></p>
          <div class="header-line"></div>
        </div>
        <img src="assets/logoazul.png" alt="BINAES" class="small-logo">
      </header>

      <section class="areas" id="areasContainer"></section>

      <section class="video-placeholder reveal">
        <!-- VIDEO VERTICAL: cambiar la ruta "video" de cada nivel en script.js -->
        <div class="video-frame">
          <video id="levelVideo" controls playsinline preload="metadata">
            <source id="levelVideoSource" src="" type="video/mp4">
          </video>
          <div class="video-empty">
            <div class="video-icon">▶</div>
            <strong id="videoFileLabel">VIDEO VERTICAL</strong>
            <span>Espacio reservado para el video del nivel</span>
          </div>
        </div>
      </section>
    </main>

  </div>

  <div class="transition-layer" id="transitionLayer"></div>
  <script src="script.js"></script>
</body>
</html>
